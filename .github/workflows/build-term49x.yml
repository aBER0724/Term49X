name: Build Term49X

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "external/**"
      - "share/**"
      - "icons/**"
      - "patches/**"
      - "scripts/**"
      - "SDL"
      - "SDL/**"
      - "TouchControlOverlay"
      - "TouchControlOverlay/**"
      - "libconfig"
      - "libconfig/**"
      - ".gitmodules"
      - ".gitattributes"
      - "Makefile"
      - "bar-descriptor.xml"
      - ".github/workflows/build-term49c.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Term49X BAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BBNDK_IMAGE: delaya73/bbndk:latest
      BBNDK_ENV: /home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh

    steps:
      - name: Checkout Term49X
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Verify repository inputs
        shell: bash
        run: |
          set -euo pipefail

          git rev-parse HEAD
          git submodule status

          test -d SDL
          test -n "$(find SDL -type f -print -quit)"
          test -s patches/sdl-term48-trackpad.patch

          if [ ! -s external/fonts/CascadiaMonoPL-Regular.ttf ]; then
            echo "::error::Missing external/fonts/CascadiaMonoPL-Regular.ttf"
            find . -type f \( -iname '*.ttf' -o -iname '*.otf' \) -print
            exit 1
          fi

          ls -lh patches/sdl-term48-trackpad.patch
          ls -lh external/fonts/CascadiaMonoPL-Regular.ttf
          git lfs ls-files || true

      - name: Restore Term49 runtime and binary dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf vendor-bar
          mkdir -p vendor-bar/unpacked external/lib share/root

          gh release download 0.4.1.7 \
            --repo BerryFarm/Term49 \
            --pattern '*.bar' \
            --dir vendor-bar

          mapfile -t bar_files < <(
            find vendor-bar -maxdepth 1 -type f -name '*.bar' -print
          )

          if [ "${#bar_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one upstream BAR; found ${#bar_files[@]}"
            printf '%s\n' "${bar_files[@]}"
            exit 1
          fi

          upstream_bar="${bar_files[0]}"
          echo "Using upstream BAR: $upstream_bar"
          sha256sum "$upstream_bar"
          unzip -q "$upstream_bar" -d vendor-bar/unpacked

          config_lib="$(find vendor-bar/unpacked -type f -name 'libconfig.so*' -print -quit)"
          tco_lib="$(find vendor-bar/unpacked -type f -name 'libTouchControlOverlay.so*' -print -quit)"

          mapfile -t root_dirs < <(
            find vendor-bar/unpacked -type d -name root -print
          )

          if [ -z "$config_lib" ]; then
            echo "::error::libconfig was not found in upstream BAR"
            exit 1
          fi

          if [ -z "$tco_lib" ]; then
            echo "::error::libTouchControlOverlay was not found in upstream BAR"
            exit 1
          fi

          if [ "${#root_dirs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one runtime root; found ${#root_dirs[@]}"
            printf '%s\n' "${root_dirs[@]}"
            exit 1
          fi

          install -m 0644 "$config_lib" external/lib/libconfig.so
          install -m 0644 "$tco_lib" external/lib/libTouchControlOverlay.so
          cp -a "${root_dirs[0]}"/. share/root/

          # Never reuse the SDL binary extracted from the upstream BAR.
          rm -f external/lib/libSDL12.so external/lib/libSDL12.so.*

          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          test -n "$(find share/root -type f -print -quit)"

          ls -lh external/lib

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing Device-Debug
          : > signing/bbpass

          # Scripts are invoked through bash, so container-side chmod is unnecessary.
          test -s scripts/build-sdl.sh
          test -s scripts/container-build.sh

      - name: Build patched Q20 SDL
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/bbndk-home \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            "$BBNDK_IMAGE" \
            /bin/bash -lc '
              set -eo pipefail
              mkdir -p "$HOME"

              BBNDK_ENV="/home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh"
              test -f "$BBNDK_ENV"

              # The legacy BBNDK script reads an optional $1 without guarding it.
              set +u
              source "$BBNDK_ENV"
              set -u

              command -v qcc
              echo "QNX_HOST=$QNX_HOST"
              echo "QNX_TARGET=$QNX_TARGET"

              rm -f SDL/config.status SDL/config.log SDL/config.cache SDL/Makefile
              find SDL -type f \( -name "*.o" -o -name "*.lo" -o -name "*.la" \) -delete

              /bin/bash scripts/build-sdl.sh

              test -s external/lib/libSDL12.so
              file external/lib/libSDL12.so
            '

      - name: Verify patched SDL
        shell: bash
        run: |
          set -euo pipefail

          grep -n 'handleTrackpadEvent' SDL/src/video/playbook/SDL_playbookevents.c
          test -s external/lib/libSDL12.so
          file external/lib/libSDL12.so
          sha256sum external/lib/libSDL12.so | tee libSDL12.so.sha256

      - name: Build and package Term49X
        shell: bash
        run: |
          set -euo pipefail

          test -s external/lib/libSDL12.so
          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          test -s external/fonts/CascadiaMonoPL-Regular.ttf
          test -n "$(find share/root -type f -print -quit)"

          # Do not call docker-build.sh here. Running Docker directly guarantees
          # that SDL and Term49 use the same host UID/GID.
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/bbndk-home \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            "$BBNDK_IMAGE" \
            /bin/bash -lc '
              set -eo pipefail
              mkdir -p "$HOME"

              BBNDK_ENV="/home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh"
              test -f "$BBNDK_ENV"

              set +u
              source "$BBNDK_ENV"
              set -u

              command -v qcc
              echo "QNX_HOST=$QNX_HOST"
              echo "QNX_TARGET=$QNX_TARGET"

              mkdir -p Device-Debug signing
              : > signing/bbpass

              find src -type f -name "*.o" -delete
              rm -f Device-Debug/Term49 Term49X.bar

              /bin/bash scripts/container-build.sh
            '

      - name: Verify executable and BAR
        shell: bash
        run: |
          set -euo pipefail

          test -s Device-Debug/Term49
          test -s Term49X.bar

          file Device-Debug/Term49
          file Term49X.bar
          ls -lh Device-Debug/Term49 Term49X.bar
          sha256sum Term49X.bar | tee Term49X.bar.sha256

      - name: Verify packaged SDL and font
        shell: bash
        run: |
          set -euo pipefail

          rm -rf verify-bar
          mkdir -p verify-bar
          unzip -q Term49X.bar -d verify-bar

          bar_sdl="$(find verify-bar -type f -name 'libSDL12.so*' -print -quit)"
          bar_font="$(find verify-bar -type f -name 'CascadiaMonoPL-Regular.ttf' -print -quit)"

          if [ -z "$bar_sdl" ]; then
            echo "::error::libSDL12.so is missing from final BAR"
            find verify-bar -maxdepth 7 -type f -print | sort
            exit 1
          fi

          if [ -z "$bar_font" ]; then
            echo "::error::CascadiaMonoPL-Regular.ttf is missing from final BAR"
            find verify-bar -maxdepth 7 -type f -print | sort
            exit 1
          fi

          cmp external/lib/libSDL12.so "$bar_sdl"
          cmp external/fonts/CascadiaMonoPL-Regular.ttf "$bar_font"

          echo "OK: patched SDL and Cascadia font are present in Term49X.bar"

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Term49X Q20 trackpad build"
            echo
            echo "Main commit:"
            git rev-parse HEAD
            echo
            echo "Submodules:"
            git submodule status
            echo
            echo "BBNDK image:"
            echo "$BBNDK_IMAGE"
            echo
            echo "BAR:"
            sha256sum Term49X.bar
            echo
            echo "SDL:"
            sha256sum external/lib/libSDL12.so
            echo
            echo "Font:"
            sha256sum external/fonts/CascadiaMonoPL-Regular.ttf
          } > build-info.txt

          cat build-info.txt

      - name: Upload Term49X artifact
        uses: actions/upload-artifact@v4
        with:
          name: Term49X-Q20-trackpad-${{ github.run_number }}
          path: |
            Term49X.bar
            Term49X.bar.sha256
            libSDL12.so.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
